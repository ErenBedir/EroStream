name: release

# Push to the `release` branch (or run manually) to publish the version in pubspec.yaml.
# The workflow creates the tag v<version>; an existing release with that tag fails the run.
on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "tag=v$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([^+ ]+).*/\1/')" >> "$GITHUB_OUTPUT"

  android:
    needs: version
    env:
      TAG: ${{ needs.version.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/fetch_tdlib.sh android
      - name: env
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: |
          python3 -c "import json,os; json.dump({'TG_API_ID': int(os.environ.get('TG_API_ID') or 0), 'TG_API_HASH': os.environ.get('TG_API_HASH',''), 'TMDB_KEY': os.environ.get('TMDB_KEY','')}, open('env.json','w'))"
      - name: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set, APKs are signed with the CI debug key"
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > android/app/release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "${KEY_PASSWORD:-$STORE_PASSWORD}" > android/key.properties
      - name: build
        run: |
          v="${TAG#v}"
          flutter build apk --release --split-per-abi --dart-define-from-file=env.json --dart-define=APP_VERSION="$v"
          mkdir -p dist
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(basename "$f" | sed -E 's/app-(.*)-release.apk/\1/')
            cp "$f" "dist/EroStream-$v-$abi.apk"
          done
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  web:
    needs: version
    env:
      TAG: ${{ needs.version.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/fetch_tdlib.sh web
      - name: build
        run: |
          v="${TAG#v}"
          # No API keys in the public web bundle; users enter their own in Settings.
          flutter build web --release --dart-define=APP_VERSION="$v"
          mkdir -p dist
          (cd build/web && zip -qr "../../dist/EroStream-$v-web.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/*

  publish:
    needs: [version, android, web]
    env:
      TAG: ${{ needs.version.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum * > SHA256SUMS)
          pre=""
          case "$TAG" in v0.*|*-*) pre="--prerelease" ;; esac
          gh release create "$TAG" dist/* --title "EroStream ${TAG#v}" --notes-file docs/release-notes.md $pre --target "$GITHUB_SHA"
