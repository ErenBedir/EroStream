name: bootstrap

# Generates the platform runner folders (android/, ios/, windows/ ...) once with
# `flutter create`. Existing files are never overwritten. Skips when android/ exists.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f android/app/build.gradle.kts ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.check.outputs.skip == 'false'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - if: steps.check.outputs.skip == 'false'
        run: |
          flutter --version
          flutter create --org io.github.erenbedir --project-name erostream \
            --platforms android,ios,web,windows,linux,macos .
          git config user.name "Muhammed Eren Bedir"
          git config user.email "74049525+ErenBedir@users.noreply.github.com"
          git add -A
          git commit -m "Add platform runners" -m "Generated with flutter create; app code untouched."
          git push
