include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - lib/l10n/gen/**
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  language:
    strict-casts: false

linter:
  rules:
    prefer_single_quotes: true
    require_trailing_commas: false
    avoid_print: true
